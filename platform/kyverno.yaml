apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://kyverno.github.io/kyverno/'
    targetRevision: 3.2.6
    chart: kyverno
    helm:
      values: |
        cleanupJobs:
          admissionReports:
            enabled: false
          clusterAdmissionReports:
            enabled: false
          clusterEphemeralReports:
            enabled: false
          ephemeralReports:
            enabled: false
          updateRequests:
            enabled: false
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
