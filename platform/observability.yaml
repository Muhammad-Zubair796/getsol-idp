apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://prometheus-community.github.io/helm-charts'
    targetRevision: 58.7.2
    chart: kube-prometheus-stack
    helm:
      values: |
        grafana:
          adminPassword: "admin"
          service:
            type: NodePort
            nodePort: 31753
          grafana.ini:
            server:
              root_url: "http://54.224.203.213:31753/"
              serve_from_sub_path: false
            auth.anonymous:
              enabled: true
              org_role: Admin
            security:
              allow_embedding: true
              cookie_secure: false
            live:
              max_connections: 0
        alertmanager:
          enabled: false
        prometheus:
          prometheusSpec:
            retention: 2d
            storageSpec: {}
            resources:
              requests:
                memory: "256Mi"
                cpu: "100m"
              limits:
                memory: "1Gi"
                cpu: "500m"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
