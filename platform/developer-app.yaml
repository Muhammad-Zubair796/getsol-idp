apiVersion: apps/v1
kind: Deployment
metadata:
  name: getsol-backend-api
  namespace: default
  labels:
    app: getsol-backend
    owner: team-zubair
spec:
  replicas: 2
  selector:
    matchLabels:
      app: getsol-backend
  template:
    metadata:
      labels:
        app: getsol-backend
        owner: team-zubair
    spec:
      containers:
      - name: api
        image: nginxdemos/hello
        ports:
        - containerPort: 80
        env:
        - name: S3_BUCKET_NAME
          value: "getsol-android-app-photos-4379"
---
apiVersion: v1
kind: Service
metadata:
  name: getsol-backend-service
  namespace: default
  labels:
    owner: team-zubair
spec:
  type: NodePort
  selector:
    app: getsol-backend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30090
