apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: getsol-workloads
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Muhammad-Zubair796/getsol-idp.git'
    targetRevision: HEAD
    path: apps
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
